[project]
name = "comfyui-gapfiller"
# Manager searches title and description, so the description has to contain the
# words people actually type: interpolation, RIFE, slow motion, fps, video.
description = "Video frame interpolation (VFI). Retime any clip to any frame rate, turn 16 or 24 fps into smooth 60 fps, or stretch it into slow motion. A RIFE alternative with arbitrary-time conditioning and six inference controls."
version = "0.1.1"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy"]
authors = [{ name = "KernelPanicKitten" }]
keywords = ["frame interpolation", "vfi", "rife", "slow motion", "fps",
            "retiming", "video", "optical flow", "60fps", "interpolation"]
classifiers = ["Topic :: Multimedia :: Video"]

[project.optional-dependencies]
ui = ["gradio>=4.0"]

[project.urls]
Repository = "https://github.com/KernelPanicKitten/ComfyUI-GapFiller"

[tool.comfy]
PublisherId = "kernelpanickitten"
DisplayName = "GapFiller"
Icon = "https://raw.githubusercontent.com/KernelPanicKitten/ComfyUI-GapFiller/master/icon.png"
