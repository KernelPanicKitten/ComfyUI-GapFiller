[project]
name = "comfyui-gapfiller"
description = "Fills the gaps between your frames. Frame interpolation with arbitrary-time conditioning and retiming to any fps."
version = "0.1.0"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy"]

[project.optional-dependencies]
ui = ["gradio>=4.0"]

[project.scripts]
gapfiller = "gapfiller.standalone:main"
gapfiller-ui = "gapfiller.standalone:ui"

[project.urls]
Repository = "https://github.com/KernelPanicKitten/ComfyUI-GapFiller"

[tool.comfy]
PublisherId = "kernelpanickitten"
DisplayName = "GapFiller"
Icon = ""
